project:
  name: "medical-segmentation-xai"
  version: "0.1.0"

task:
  name: "binary_segmentation"
  num_classes: 1

data:
  name: "Kvasir-SEG"
  image_size: 256
  image_channels: 3
  batch_size: 4
  num_workers: 0

model:
  name: "unet"
  in_channels: 3
  out_channels: 1
  features: [32, 64, 128, 256]

loss:
  name: "bce_dice"
  bce_weight: 0.5
  dice_weight: 0.5

optimizer:
  name: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: "plateau"
  monitor: "val_dice"
  mode: "max"
  factor: 0.5
  patience: 2
  min_lr: 0.000001

early_stopping:
  monitor: "val_dice"
  mode: "max"
  patience: 3
  min_delta: 0.001

training:
  epochs: 20
  seed: 42

device:
  type: "auto"

reproducibility:
  seed: 42

