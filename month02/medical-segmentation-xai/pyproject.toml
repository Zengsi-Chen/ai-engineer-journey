[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "medical-segmentation-xai"
version = "0.1.0"
description = "Medical image segmentation and explainable AI project"
requires-python = ">=3.12"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]