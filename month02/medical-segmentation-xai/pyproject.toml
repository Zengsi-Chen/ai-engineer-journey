[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-segmentation-xai"
version = "0.1.0"
description = "Medical image segmentation and explainable AI project"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "numpy==2.5.2",
    "Pillow==12.3.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
